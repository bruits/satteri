name: Deploy Website

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "website/**"
      - ".github/workflows/deploy-website.yml"
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    # Release runs on every push to main, but only a release merge publishes a new version.
    if: >-
      (github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion == 'success'
        && startsWith(github.event.workflow_run.head_commit.message, 'Release (main)'))
      || (github.event_name != 'workflow_run'
        && !contains(github.event.head_commit.message, '[skip cd]'))
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: latest
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      # The lockfile pins whatever `latest` was when it was last refreshed.
      - name: Use the latest published Sätteri
        run: pnpm --filter satteri-website update satteri

      - uses: moonrepo/setup-rust@abb2d32350334249b178c401e5ec5836e0cd88d3 # v1.3.0
        with:
          cache-target: release
          target-dirs: target, website/target
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Website
        run: cargo run --release
        working-directory: website

      - name: Deploy
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          workingDirectory: ./website
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
